name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 8 */3 * *' # ogni 3 giorni alle 8:00
  workflow_dispatch: # eseguibile manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=id&limit=1"
